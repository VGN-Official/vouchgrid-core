<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VouchGrid Core Network</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-teal: #0d9488;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --verified-green: #10b981;
            --pending-orange: #f59e0b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 480px;
            margin-top: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header h1 {
            color: var(--accent-teal);
            margin: 0;
            font-size: 28px;
            letter-spacing: 1px;
        }
        .header p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 14px;
        }
        /* Identity Banner */
        .auth-banner {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        .auth-status {
            font-weight: 600;
        }
        .auth-btn {
            background-color: var(--accent-teal);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        /* Navigation Tabs Layout */
        .nav-tabs {
            display: flex;
            background-color: var(--card-bg);
            padding: 4px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid #334155;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: var(--accent-teal);
            color: white;
        }
        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
            display: none;
        }
        .card.active {
            display: block;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 14px;
        }
        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: white;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-teal);
        }
        button.submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-teal);
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.submit-btn:hover {
            background-color: #0f766e;
        }
        button.submit-btn:disabled {
            background-color: #334155;
            color: var(--text-muted);
            cursor: not-allowed;
        }
        .response-box {
            display: none;
            padding: 16px;
            border-radius: 6px;
            font-size: 14px;
            margin-top: 15px;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .success { background-color: #064e3b; color: #a7f3d0; border: 1px solid #047857; }
        .error { background-color: #7f1d1d; color: #fecaca; border: 1px solid #b91c1c; }
        
        /* Profile Display Badge Styling */
        .profile-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            margin-top: 5px;
        }
        .badge-verified { background-color: var(--verified-green); color: #0f172a; }
        .badge-pending { background-color: var(--pending-orange); color: #0f172a; }
    </style>

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>

    <script>Pi.init({ version: "2.0", sandbox: false });</script>

</head>
<body>

<div class="container">
    <div class="header">
        <h1>VOUCHGRID</h1>
        <p>Consensus Trust & Identity Architecture</p>
    </div>

    <div class="auth-banner">
        <span id="authText" class="auth-status">Pi Network: Connecting...</span>
        <button id="authBtn" class="auth-btn" style="display: none;" onclick="authenticatePiUser()">Sign In</button>
    </div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('customerView', this)">Customer Lookup</button>
        <button class="tab-btn" onclick="withAuthCheck('operatorView', this)">Operator Portal</button>
    </div>

    <div id="customerView" class="card active">
        <h3 style="margin-top:0; color: var(--accent-teal);">Public Verification Engine</h3>
        <p style="color: var(--text-muted); font-size:14px; margin-bottom:20px;">Verify the status and consensus evaluation of any merchant instantly.</p>
        <div class="form-group">
            <label for="searchUsername">Enter Merchant Username</label>
            <input type="text" id="searchUsername" placeholder="e.g., mohammed_bauchi">
        </div>
        <button class="submit-btn" id="searchBtn" onclick="lookupMerchant()">Verify Merchant Credential</button>
        <div id="searchResponse" class="response-box"></div>
    </div>

    <div id="operatorView" class="card">
        <h3 style="margin-top:0; color: var(--accent-teal);">Attestation Entry Terminal</h3>
        <p style="color: var(--text-muted); font-size:14px; margin-bottom:20px;">Secure data ingestion node for field validation officers.</p>
        <form id="vouchForm">
            <div class="form-group">
                <label for="targetUsername">Target Merchant Username</label>
                <input type="text" id="targetUsername" required placeholder="e.g., mohammed_bauchi">
            </div>
            <div class="form-group">
                <label for="validatorUsername">Validator Operator ID</label>
                <input type="text" id="validatorUsername" required placeholder="e.g., operator_02" readonly>
            </div>
            <button type="submit" class="submit-btn" id="submitBtn" disabled>Submit Attestation Vouch</button>

            <!--<button type="button" id="testPaymentBtn">Run Test Pi Payment</button>-->
            </form>
        <div id="vouchResponse" class="response-box"></div>
    </div>
</div>

<script>
// --- 1. GLOBAL SYSTEM STATES ---
let isInitialized = false;
let isPiEngineReady = false; 
let verifiedPiUser = localStorage.getItem('pi_user') || null;

// --- 2. LIFE-CYCLE BOOT ENGAGEMENT ---
window.addEventListener('DOMContentLoaded', async () => {
    console.log("[VouchGrid Grid] DOM Loaded. Initializing Pi Core Handshake safely...");
    
    // Guard form listener initialization against missing DOM nodes safely
    const vouchForm = document.getElementById('vouchForm');
    if (vouchForm) {
        vouchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await triggerPiPayment();
        });
    }
    
    await initPiNetwork();
});

// --- HELPER FUNCTIONS ---
// Helper: reject if the given promise doesn't settle in `ms`.
function withTimeout(promise, ms, label) {
    return Promise.race([
        promise,
        new Promise((_, reject) =>
            setTimeout(() => reject(new Error(`${label} timed out after ${ms}ms`)), ms)
        )
    ]);
}

// Helper: are we actually running inside the Pi Browser?
function isPiBrowser() {
    return /PiBrowser/i.test(navigator.userAgent);
}

// --- 3. PLATFORM CORE INITIALIZATION ENGINE ---
async function initPiNetwork() {
    const authStatusText = document.getElementById('authText');
    const authButton     = document.getElementById('authBtn');

    if (!window.Pi) {
        if (authStatusText) authStatusText.innerText = "Pi SDK failed to load";
        if (authButton) authButton.style.display = "block";
        return;
    }

    if (!isPiBrowser()) {
        if (authStatusText) authStatusText.innerText = "Open this app inside the Pi Browser to sign in";
        if (authButton) authButton.style.display = "block";
        return;
    }

    try {
        if (authStatusText) authStatusText.innerText = "Authenticating Session...";

        await window.Pi.init({ version: "2.0", sandbox: true });
        isInitialized = true;
        console.log("[VouchGrid] Pi.init resolved safely.");

        // Execute authentication before marking the pipeline operational
        await authenticatePiUser();
    } catch (err) {
        console.error("[VouchGrid] Init failure:", err);
        isPiEngineReady = false;
        if (authStatusText) authStatusText.innerText = "Connection Refused";
        if (authButton) authButton.style.display = "block";
    }
}

// --- 4. SECURE USER AUTHENTICATION NODES ---
async function authenticatePiUser() {
    const authStatusText = document.getElementById('authText');
    const authButton = document.getElementById('authBtn');
    const submitBtn = document.getElementById('submitBtn');
    const validatorInput = document.getElementById('validatorUsername');

    if (authStatusText) authStatusText.innerText = "Authenticating Session...";
    if (authButton) authButton.style.display = "none";

    try {
        console.log("[VouchGrid Grid] Triggering Pi.authenticate with expanded username and payments scopes...");
        
        
    
        // 1) Authenticate with Pi FIRST using your file's existing withTimeout wrapper
        console.log("[Pi SDK] Initializing authentication wrapper sequence...");
        
        const authPromise = new Promise((resolve, reject) => {
            window.Pi.authenticate(["username", "payments"], (paymentReceived) => {
                if (typeof onIncompletePaymentFound === "function" && paymentReceived) {
                    onIncompletePaymentFound(paymentReceived);
                }
            })
            .then(auth => resolve(auth))
            .catch(err => reject(err));
        });

        // This uses the exact withTimeout helper function found on line 18 of your file
        const auth = await withTimeout(authPromise, 15000, "Pi Authentication");

        if (!auth || !auth.accessToken) {
            throw new Error("Pi.authenticate returned no accessToken");
        }
        
        console.log("[VouchGrid] Token received. Validating with backend...");

        // 2) Validate the token with your backend
        const verifyRes = await fetch('/api/pi-auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ accessToken: auth.accessToken })
        });
        const verifyData = await verifyRes.json().catch(() => ({}));

        if (!verifyRes.ok || !verifyData.success) {
            throw new Error(verifyData.error || `Backend rejected token (${verifyRes.status})`);
        }

        console.log("[VouchGrid] Handshake validated for:", verifyData.username);
        verifiedPiUser = { username: verifyData.username };
        isPiEngineReady = true;
        localStorage.setItem('pi_user', verifyData.username);

        if (authStatusText) authStatusText.innerText = `Connected: @${verifyData.username}`;
        if (validatorInput) validatorInput.value = verifyData.username;
        if (submitBtn) submitBtn.disabled = false;

        const merchantId = document.getElementById('searchUsername')?.value.trim() || "";

        // 3) Only query memory layer if there is an active search query present
        if (merchantId) {
            const res = await fetch("/api/verify-merchant", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${auth.accessToken}`,
                },
                body: JSON.stringify({ merchantId })
            });
            if (!res.ok) throw new Error(`Memory layer ${res.status}: ${await res.text()}`);
            const data = await res.json();
            console.log("[VouchGrid] Memory layer payload retrieved:", data);
            // ...use data...
        } else {
            console.log("[VouchGrid] Clear authentication complete. Standing by for user lookup actions.");
        }

    } catch (err) {
        console.error("[VouchGrid] Handshake denied:", err);
        // Visible on-screen debug (remove once fixed)
        document.body.insertAdjacentHTML(
            "beforeend",
            `<pre style="position:fixed;bottom:0;left:0;right:0;background:#111;color:#0f0;padding:8px;font:12px monospace;white-space:pre-wrap;z-index:9999">${err.message}\n${err.stack || ""}</pre>`
        );
        isPiEngineReady = false;
        if (authStatusText) authStatusText.innerText = "Authentication Failed";
        if (authButton) authButton.style.display = "block";
        if (validatorInput) validatorInput.value = "";
    }
} // Closes the parent authenticate function securely



// --- 5. COMPREHENSIVE U2A PAYMENT TRANSFERS ---
// This event listener attaches the payment logic explicitly to your purple button
window.addEventListener('DOMContentLoaded', () => {
    const testPaymentBtn = document.getElementById('testPaymentBtn'); // Assumes your purple button has this ID
    if (testPaymentBtn) {
        testPaymentBtn.addEventListener('click', async (e) => {
            e.preventDefault();
            await triggerPiPayment();
        });
    }
});

async function triggerPiPayment() {
    const submitBtn = document.getElementById('submitBtn');
    const responseBox = document.getElementById('vouchResponse');
    const targetUsername = document.getElementById('targetUsername').value.trim();
    const validatorUsername = document.getElementById('validatorUsername').value.trim();

    if (!isPiEngineReady) {
        alert("Pi Engine is not ready. Please authenticate first.");
        return;
    }

    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = "Initializing Pi Wallet Modal...";
    }
    if (responseBox) responseBox.style.display = "none";

    try {
        const paymentData = {
            amount: 0.1,
            memo: `Merchant Attestation Fee for @${targetUsername}`,
            metadata: { 
                targetMerchant: targetUsername,
                validatorOperator: validatorUsername 
            }
        };

        console.log("[VouchGrid Payments] Launching wallet payment interface...");
        
        await window.Pi.createPayment(paymentData, {
            onReadyForServerApproval: async (paymentId) => {
                console.log("[VouchGrid Payments] Payment created on ledger. Approving ID:", paymentId);
                const res = await fetch('/api/pi-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'approve', paymentId })
                });
                const data = await res.json();
                return data.success;
            },
            onReadyForServerCompletion: async (paymentId, txid) => {
                console.log("[VouchGrid Payments] User signed transaction. Completing TxID:", txid);
                
                const res = await fetch('/api/pi-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        action: 'complete', 
                        paymentId, 
                        txid,
                        targetUsername,
                        validatorUsername
                    })
                });
                
                const finalData = await res.json();
                if (responseBox) responseBox.style.display = "block";
                
                if (res.ok && finalData.success) {
                    if (responseBox) {
                        responseBox.className = "response-box success";
                        responseBox.innerText = `Payment Complete & Attestation Approved!\nTxID: ${txid}`;
                    }

                    if (submitBtn) {
                            submitBtn.innerText = "Attestation Approved! ✓";
                    }
                } else {
                    throw new Error(finalData.error || "Failed to complete transaction database records.");
                }
            },
            onCancel: (paymentId) => {
                console.warn("[VouchGrid Payments] Transaction canceled by user:", paymentId);
                if (responseBox) {
                    responseBox.className = "response-box error";
                    responseBox.style.display = "block";
                    responseBox.innerText = "Payment process canceled by user.";
                }
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Submit Attestation Vouch";
                }
            },
            onError: (error, payment) => {
                console.error("[VouchGrid Payments] Critical Wallet Error:", error);
                if (responseBox) {
                    responseBox.className = "response-box error";
                    responseBox.style.display = "block";
                    responseBox.innerText = `Wallet Exception: ${error.message || "Transaction aborted."}`;
                }
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "Submit Attestation Vouch";
                }
            }
        });

    } catch (err) {
        console.error("[VouchGrid Payments] Error lifecycle:", err);
        if (responseBox) {
            responseBox.className = "response-box error";
            responseBox.style.display = "block";
            responseBox.innerText = err.message || "Network Error.";
        }
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Attestation Vouch";
        }
    }
}

async function onIncompletePaymentFound(payment) {
    console.warn("[VouchGrid Payments] Unresolved transactional payload found. Clearing with engine:", payment.identifier);
    await fetch('/api/pi-payment', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            action: 'complete', 
            paymentId: payment.identifier, 
            txid: payment.transaction.txid, 
            incompleteRecovery: true 
        })
    });
}

// --- 6. DATA REGISTRY QUERY ARCHITECTURE ---
async function lookupMerchant() {
    const username = document.getElementById('searchUsername').value.trim();
    const searchBtn = document.getElementById('searchBtn');
    const responseBox = document.getElementById('searchResponse');

    if (!username) {
        alert("Please enter a username to look up.");
        return;
    }

    if (searchBtn) {
        searchBtn.disabled = true;
        searchBtn.innerText = "Querying Cloud Grid...";
    }
    if (responseBox) responseBox.style.display = "none";

    try {
        const response = await fetch('/api/lookup-merchant', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ targetUsername: username, validatorUsername: "PUBLIC_LOOKUP_QUERY" })
        });

        const data = await response.json();
        if (responseBox) responseBox.style.display = "block";

        if (response.ok || data.user) {
            if (responseBox) {
                responseBox.className = "response-box success";
                const profile = data.user || data;
                
                let badgeClass = profile.currentStatus === 'VERIFIED' || profile.kycStatus === 'VERIFIED' ? 'badge-verified' : 'badge-pending';
                let statusText = profile.currentStatus || profile.kycStatus || "PENDING";
                let count = profile.vouchesCount !== undefined ? profile.vouchesCount : (profile.vouchesReceived ? profile.vouchesReceived.length : 0);
                let reqCount = profile.requiredVouches || 3;

                responseBox.innerHTML = `
                    <strong>Merchant ID:</strong> @${username}<br>
                    <strong>Network Status:</strong> <span class="profile-badge ${badgeClass}">${statusText}</span><br>
                    <strong>Consensus Weight:</strong> ${count}/${reqCount} Attestations Verified
                `;
            }
        } else {
            if (responseBox) {
                responseBox.className = "response-box error";
                responseBox.innerText = `System Notice: ${data.error || "No active record found."}`;
            }
        }
    } catch (err) {

        console.error("[VouchGrid Lookup Error]:", err); // Prints the exact error to console log for debugging

        if (responseBox) {
            responseBox.style.display = "block";
            responseBox.className = "response-box error";
            responseBox.innerText = `Network Failure: Failed to pull data from memory layer.`;
        }
    } finally {
        if (searchBtn) {
            searchBtn.disabled = false;
            searchBtn.innerText = "Verify Merchant Credential";
        }
    }
}

// --- 7. INTERACTIVE VISUAL NAVIGATION FUNCTIONS ---
function switchTab(viewId, element) {
    document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    const cardNode = document.getElementById(viewId);
    if (cardNode) cardNode.classList.add('active');
    if (element) element.classList.add('active');
}

function withAuthCheck(viewId, element) {
    const inputNode = document.getElementById('validatorUsername');
    const validatorUsername = inputNode ? inputNode.value : "";
    if (!validatorUsername) {
        alert("Please complete Pi Network authentication first to open the Operator Portal.");
        authenticatePiUser();
        return;
    }
    switchTab(viewId, element);
}
</script>

</body>
</html>
